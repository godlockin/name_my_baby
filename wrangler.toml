[vars]
ENVIRONMENT = "development"

compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-01-01"

[dev]
port = 3001

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "name-my-baby-db"
database_id = "local-dev-db-id"

# R2 Bucket
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "name-my-baby-storage"
