name = "name-my-baby"
pages_build_output_dir = ".vercel/output/static"

[vars]
ENVIRONMENT = "development"

[dev]
port = 3000
local = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "name-my-baby-db"
database_id = "0133574c-930a-4c62-92d3-9b7d58c6cb47"

# R2 Bucket
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "name-my-baby-storage"
